<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Questboard{% endblock %} — ffxivpp</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #14141f; color: #d8d8e0; margin: 0; padding: 2rem; }
    a { color: #7ab8ff; text-decoration: none; }
    a:hover { text-decoration: underline; }
    h1 { margin-top: 0; }
    .card { background: #1d1d2b; border: 1px solid #2c2c40; border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 1rem; }
    .muted { color: #80809a; font-size: 0.9rem; }
    .chip { display: inline-block; background: #26263a; border-radius: 6px; padding: 0.1rem 0.5rem; margin-right: 0.3rem; font-size: 0.85rem; }
    .chip.hq { background: #4a3410; color: #ffcc66; }
    .chip.done { background: #143a1c; color: #7ddf8f; }
    button { background: #2b3f66; border: none; border-radius: 6px; color: #cfe3ff; padding: 0.45rem 0.9rem; cursor: pointer; }
    button:hover { background: #365086; }
    button.danger { background: #5a2430; color: #ffb3c0; }
    input, select { background: #23233a; border: 1px solid #38385a; color: #d8d8e0; border-radius: 6px; padding: 0.4rem; }
    ul.tree { list-style: none; padding-left: 1rem; }
    ul.tree > li { margin: 0.3rem 0; }
    .bar { display: inline-flex; height: 8px; background: #26263a; border-radius: 4px; overflow: hidden; vertical-align: middle; min-width: 6rem; }
    .bar > span { display: block; height: 100%; background: #3f7f52; }
    .rowline { display: flex; align-items: center; gap: 0.35rem; flex-wrap: wrap; }
    .nav { display: flex; gap: 1.1rem; align-items: center; background: #1d1d2b; border: 1px solid #2c2c40; border-radius: 10px; padding: 0.45rem 0.9rem; margin-bottom: 1.25rem; }
    .nav a { font-weight: 600; }
    .nav a.active { color: #ffffff; text-decoration: underline; text-underline-offset: 4px; }
    .nav .brand { color: #80809a; font-weight: 700; letter-spacing: 0.05em; margin-right: auto; }
  </style>
</head>
<body>
  <nav class="nav">
    <span class="brand"><a href="/">ffxivpp</a></span>
    <a href="/party/" {% if request.path.startswith('/party') %}class="active"{% endif %}>Party</a>
    <a href="/quests/" {% if request.path.startswith('/quests') %}class="active"{% endif %}>Questboard</a>
    <a href="/voyages/" {% if request.path.startswith('/voyages') %}class="active"{% endif %}>Voyages</a>
    <a href="/chest/" {% if request.path.startswith('/chest') %}class="active"{% endif %}>Chest</a>
  </nav>
  {% block content %}{% endblock %}
  <script>
    async function postJson(url, body) {
      const resp = await fetch(url, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(body || {})
      });
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok) { alert(data.error || resp.status); return null; }
      return data;
    }
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
