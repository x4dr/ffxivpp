name: Deploy

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Install Playwright Chromium
        run: uv run playwright install --with-deps chromium
      - run: uv run pytest

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deployment is pull-based
        run: |
          # The host is behind NAT and the public version endpoint is behind
          # Cloudflare's bot protection, which rejects datacenter IPs. The host
          # pulls origin/main via ffxiv-deploy.timer, so there is nothing to
          # call from here. This job documents that model and keeps the gate.
          echo "The server will pull $GITHUB_SHA within a minute."
