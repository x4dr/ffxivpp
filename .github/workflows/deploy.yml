name: Deploy

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Install Playwright Chromium
        run: uv run playwright install --with-deps chromium
      - run: uv run pytest

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the server to deploy this commit
        run: |
          # The host is behind NAT, so it pulls main on a systemd timer.
          # This job only verifies the rollout through a public endpoint.
          for attempt in $(seq 1 60); do
            commit=$(curl -sf https://ffxiv.nossinet.cc/deploy/version | jq -r '.commit // empty' || true)
            if [ "$commit" = "$GITHUB_SHA" ]; then
              echo "deployed $commit"
              exit 0
            fi
            echo "waiting for $GITHUB_SHA (server has ${commit:-unknown})"
            sleep 5
          done
          echo "server did not reach $GITHUB_SHA"
          exit 1
