server {
    listen 80;
    listen [::]:80;
    server_name ffxiv.nossinet.cc;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ffxiv.nossinet.cc;

    ssl_certificate /etc/letsencrypt/live/ffxiv.nossinet.cc/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ffxiv.nossinet.cc/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Trainer account saves carry base64 .DAT files; nginx defaults to 1 MB.
    client_max_body_size 8m;

    # The action index is 1.1 MB of JSON. Compress the static trainer assets.
    gzip on;
    gzip_min_length 1024;
    gzip_types application/javascript text/javascript application/json text/css;

    location / {
        proxy_pass http://127.0.0.1:7111;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
